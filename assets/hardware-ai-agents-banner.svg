<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
      }

      /* Animated pulses and orbits */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes beaconRing {
        0% { r: 6; opacity: 1; stroke-width: 2; }
        100% { r: 24; opacity: 0; stroke-width: 0.5; }
      }

      .pulse-orb {
        transform-origin: center;
        animation: pulseGlow 5s ease-in-out infinite alternate;
      }
      .floating-card-1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatSlow2 8s ease-in-out infinite;
      }
      .circuit-flow {
        stroke-dasharray: 8 12;
        animation: dashFlow 2s linear infinite;
      }
      .beacon-circle {
        animation: beaconRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .beacon-circle-delay {
        animation: beaconRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        animation-delay: 1.25s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Dynamic Glowing Orbs (Deep in background) -->
  <g opacity="0.6">
    <circle cx="150" cy="80" r="120" fill="#0284c7" opacity="0.2" filter="url(#glow)" class="pulse-orb" />
    <circle cx="1050" cy="280" r="150" fill="#7c3aed" opacity="0.2" filter="url(#glow)" class="pulse-orb" style="animation-delay: -2.5s;" />
    <circle cx="600" cy="20" r="100" fill="#059669" opacity="0.15" filter="url(#glow)" class="pulse-orb" style="animation-delay: -1.2s;" />
  </g>

  <!-- Dynamic Circuit Pathways and Data Flow Lines (Behind text) -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M 40 180 H 220 L 260 220 H 420" />
    <path d="M 1160 180 H 980 L 940 140 H 780" />
    <path d="M 300 40 V 100 L 340 140 H 500" />
    <path d="M 900 320 V 260 L 860 220 H 700" />
    <!-- Dynamic Animated Data Stream Paths -->
    <path class="circuit-flow" stroke="#38bdf8" stroke-width="2" opacity="0.7" d="M 40 180 H 220 L 260 220 H 420" />
    <path class="circuit-flow" stroke="#a855f7" stroke-width="2" opacity="0.7" d="M 1160 180 H 980 L 940 140 H 780" />
  </g>

  <!-- Left Dynamic Hardware Badge Element (Background Accent) -->
  <g class="floating-card-1" transform="translate(50, 60)" opacity="0.85">
    <rect width="170" height="100" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <rect x="12" y="14" width="32" height="32" rx="6" fill="url(#chipGrad)" stroke="#38bdf8" stroke-width="1" />
    <rect x="20" y="22" width="16" height="16" rx="2" fill="#38bdf8" opacity="0.8" />
    <text x="54" y="28" fill="#e2e8f0" class="pill-text" font-size="12">MCU Runtime</text>
    <text x="54" y="42" fill="#38bdf8" class="pill-text" font-size="10">ESP32-S3 • C5</text>
    <circle cx="145" cy="24" r="4" fill="#10b981" />
    <circle cx="145" cy="24" r="6" fill="none" stroke="#10b981" class="beacon-circle" />
    <circle cx="145" cy="24" r="6" fill="none" stroke="#10b981" class="beacon-circle-delay" />
    <text x="16" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11">Local Tool Execution</text>
    <text x="16" y="90" fill="#38bdf8" font-family="monospace" font-size="10">0.00ms Cloud Latency</text>
  </g>

  <!-- Right Dynamic Hardware Badge Element (Background Accent) -->
  <g class="floating-card-2" transform="translate(980, 200)" opacity="0.85">
    <rect width="170" height="100" rx="10" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" />
    <rect x="12" y="14" width="32" height="32" rx="6" fill="url(#chipGrad)" stroke="#10b981" stroke-width="1" />
    <circle cx="28" cy="30" r="7" fill="none" stroke="#10b981" stroke-width="2" />
    <circle cx="28" cy="30" r="3" fill="#10b981" />
    <text x="54" y="28" fill="#e2e8f0" class="pill-text" font-size="12">Wearable Agent</text>
    <text x="54" y="42" fill="#10b981" class="pill-text" font-size="10">Vision • Speech</text>
    <circle cx="145" cy="24" r="4" fill="#38bdf8" />
    <circle cx="145" cy="24" r="6" fill="none" stroke="#38bdf8" class="beacon-circle" />
    <text x="16" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11">Multimodal Telemetry</text>
    <text x="16" y="90" fill="#10b981" font-family="monospace" font-size="10">Continuous Lifelog</text>
  </g>

  <!-- High-Contrast Central Content Area (Guaranteed Foreground Visibility) -->
  <rect x="220" y="45" width="760" height="270" rx="20" fill="#030712" fill-opacity="0.85" stroke="#1e293b" stroke-width="1" />

  <!-- Top Category Tag Pill -->
  <g transform="translate(480, 70)">
    <rect width="240" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="15" r="5" fill="#38bdf8" />
    <circle cx="18" cy="15" r="5" fill="none" stroke="#38bdf8" class="beacon-circle" />
    <text x="32" y="20" fill="#e0f2fe" class="pill-text" letter-spacing="1">CURATED HARDWARE AI</text>
  </g>

  <!-- Foreground Title -->
  <text x="600" y="160" text-anchor="middle" fill="url(#textGrad)" class="title-text" font-size="46" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">Awesome Hardware AI Agents</text>

  <!-- Foreground Subtitle -->
  <text x="600" y="200" text-anchor="middle" fill="#e2e8f0" class="subtitle-text" font-size="18" letter-spacing="0.2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))">Wearable AI Devices • Microcontroller Agent Runtimes • Open-Source Hardware Revival</text>

  <!-- Lower Tech Spec Highlights / Flow Pills (Foreground) -->
  <g transform="translate(310, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="36" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
    <text x="85" y="23" text-anchor="middle" fill="#38bdf8" class="pill-text" font-size="13">⚡ ESP32 &amp; RP2040</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="210" height="36" rx="8" fill="#111827" stroke="#a855f7" stroke-width="1" stroke-opacity="0.7" />
    <text x="290" y="23" text-anchor="middle" fill="#c084fc" class="pill-text" font-size="13">👓 Smart Glasses &amp; Pins</text>

    <!-- Pill 3 -->
    <rect x="410" y="0" width="170" height="36" rx="8" fill="#111827" stroke="#10b981" stroke-width="1" stroke-opacity="0.7" />
    <text x="495" y="23" text-anchor="middle" fill="#34d399" class="pill-text" font-size="13">🔄 Local Agent Loops</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="260" y="295" width="680" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.8" />
</svg>
